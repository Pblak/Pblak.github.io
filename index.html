<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pblak Games</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b2233; --muted: #5a6478; --acc: #d4102c; --card: #f3f5fa; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #e8ecf7; --muted: #a2acc4; --acc: #ff5a70; --card: #161d33; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    h1 { font-size: 1.8rem; margin: 0 0 0.3rem; }
    .meta { color: var(--muted); margin: 0 0 2rem; }
    .game { background: var(--card); border-radius: 12px; padding: 1rem 1.2rem; }
    .game h2 { font-size: 1.2rem; margin: 0 0 0.3rem; }
    .game p { margin: 0.3rem 0; }
    a { color: var(--acc); }
  </style>
</head>
<body>
<main>
  <h1>Pblak Games</h1>
  <p class="meta">Small games for phones.</p>
  <div class="game">
    <h2>Low Poly Pursuit</h2>
    <p>Arcade police chase: outrun the cops, drift, jump and grab cash.</p>
    <p><a href="lowpolypursuit/privacy-policy.html">Privacy policy</a></p>
  </div>
  <p class="meta" style="margin-top:2rem">Contact: <a href="mailto:atibba.dz@gmail.com">atibba.dz@gmail.com</a></p>
</main>
</body>
</html>
